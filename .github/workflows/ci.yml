name: CI - Verification & Quality Suite (100% Free)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-security:
    name: Node.js Unit & Security Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run 20 Unit & Security Tests
        run: npm test

  build-and-accessibility:
    name: Vite Build & Playwright Accessibility Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Web App
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests & Axe-Core Accessibility
        run: npx playwright test

      - name: Upload Test Artifacts (if failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-report
          path: test-results/
          retention-days: 7
