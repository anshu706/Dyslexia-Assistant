<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dyslexia Assistant </title>
    <meta name="description" content="Dyslexia Assistant Application Workspace.">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/accessibility.css">

    <!-- External Parsers -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
</head>

<body class="app-body">
    <a href="#workspace" class="skip-link">Skip to workspace</a>

    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="app-sidebar" aria-label="Application Tools">
            <div class="sidebar-header">
                <a href="/" class="logo-small" aria-label="Home">D.A.</a>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" data-view="reader" data-i18n-aria="nav.read" aria-current="page">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    <span data-i18n="nav.read">Read</span>
                </button>
                <button class="nav-btn" data-view="writer" data-i18n-aria="nav.write">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                    </svg>
                    <span data-i18n="nav.write">Write</span>
                </button>
                <button class="nav-btn" data-view="flashcards" data-i18n-aria="nav.cards">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <line x1="9" y1="21" x2="9" y2="21"></line>
                    </svg>
                    <span data-i18n="nav.cards">Cards</span>
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="nav-btn" id="toggle-settings" aria-label="Settings">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- MAIN WORKSPACE -->
        <main class="app-main" id="workspace">

            <!-- TOOLBAR (Contextual) -->
            <header class="app-toolbar">
                <div class="toolbar-group reader-tools">
                    <label class="btn-tool upload-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <span data-i18n="toolbar.upload">Upload Document</span>
                        <input type="file" id="file-upload" accept=".txt,.pdf,.docx" class="sr-only">
                    </label>
                    <div class="divider"></div>
                    <button class="btn-tool" id="tool-font" data-i18n-aria="toolbar.toggleFont" data-i18n-title="toolbar.toggleFont" data-i18n="toolbar.font">Aa</button>
                    <button class="btn-tool" id="tool-spacing" data-i18n-aria="toolbar.spacing" data-i18n-title="toolbar.spacing">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="21" y1="10" x2="3" y2="10"></line>
                            <line x1="21" y1="6" x2="3" y2="6"></line>
                            <line x1="21" y1="14" x2="3" y2="14"></line>
                            <line x1="21" y1="18" x2="3" y2="18"></line>
                        </svg>
                    </button>
                    <button class="btn-tool" id="tool-overlay" data-i18n-aria="toolbar.overlay" data-i18n-title="toolbar.overlay">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 2a10 10 0 0 0 0 20"></path>
                        </svg>
                    </button>
                    <button class="btn-tool" id="tool-ruler" data-i18n-aria="toolbar.ruler" data-i18n-title="toolbar.ruler">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="3" y1="9" x2="21" y2="9"></line>
                        </svg>
                    </button>
                </div>

                <div class="toolbar-group tts-tools" style="margin-left: auto;">
                    <button class="btn-tool" id="tts-play" data-i18n-aria="toolbar.play">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                    </button>
                    <button class="btn-tool" id="tts-pause" data-i18n-aria="toolbar.pause" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="6" y="4" width="4" height="16"></rect>
                            <rect x="14" y="4" width="4" height="16"></rect>
                        </svg>
                    </button>
                    <button class="btn-tool" id="tts-stop" data-i18n-aria="toolbar.stop">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="6" y="6" width="12" height="12"></rect>
                        </svg>
                    </button>
                    <div class="divider"></div>
                    
                    <label for="tts-voice" class="sr-only" data-i18n="toolbar.voiceLabel">Voice & Language</label>
                    <select id="tts-voice" class="tool-select" style="max-width: 150px; text-overflow: ellipsis;" data-i18n-title="toolbar.voiceLabel">
                        <option value="" data-i18n="toolbar.defaultVoice">Default Voice</option>
                    </select>
                    <label for="tts-speed" class="sr-only" data-i18n="toolbar.speedLabel">Speech Speed</label>
                    <select id="tts-speed" class="tool-select">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1.0x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                    </select>
                </div>
            </header>

            <!-- VIEW: READER -->
            <section id="view-reader" class="view-panel active" aria-label="Reading Environment">
                <div id="reader-content" class="reader-container empty" tabindex="0">
                    <div class="empty-state">
                        <h2 class="text-xl" data-i18n="reader.title">Ready to Read.</h2>
                        <p class="text-muted" data-i18n="reader.subtitle">Upload a .txt, .pdf, or .docx file to begin.</p>
                    </div>
                </div>
                <div id="reading-ruler" class="reading-ruler hidden"></div>
            </section>

            <!-- VIEW: WRITER -->
            <section id="view-writer" class="view-panel" aria-label="Writing Environment" hidden>
                <div class="writer-container">
                    <div class="writer-stats">
                        <span><span id="word-count-num">0</span> <span data-i18n="writer.words">words</span></span>
                        <span id="reading-level" class="badge" data-i18n="writer.gradeLevel">Grade 4 Level</span>
                    </div>
                    <textarea id="writer-editor" class="writer-textarea"
                        data-i18n-placeholder="writer.placeholder" placeholder="Start typing your story here..."></textarea>
                    <!-- Phonetic suggestions will pop up here dynamically -->
                    <div id="phonetic-suggestions" class="suggestions-popover hidden"></div>
                </div>
            </section>

            <!-- VIEW: FLASHCARDS -->
            <section id="view-flashcards" class="view-panel" aria-label="Flashcards Environment" hidden>
                <div class="flashcards-container">
                    <h2 class="text-xl" data-i18n="cards.title">Flashcards.</h2>
                    <p class="text-muted" data-i18n="cards.subtitle">Your spaced repetition learning hub.</p>

                    <div class="flashcard-creator">
                        <input type="text" id="fc-front" class="card-input" data-i18n-placeholder="cards.frontPlaceholder" placeholder="Front (e.g. Word)"
                            aria-label="Flashcard Front">
                        <input type="text" id="fc-back" class="card-input" data-i18n-placeholder="cards.backPlaceholder" placeholder="Back (e.g. Meaning)"
                            aria-label="Flashcard Back">
                        <button class="btn" id="fc-add" data-i18n="cards.addCard">Add Card</button>
                    </div>

                    <div class="cards-grid" id="cards-grid">
                        <!-- Cards injected by JS -->
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/reader.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/flashcards.js"></script>
</body>

</html>
