version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dyslexia-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dyslexia_db
      POSTGRES_USER: dyslexia_user
      POSTGRES_PASSWORD: dyslexia_secure_password_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dyslexia_user -d dyslexia_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dyslexia-assistant-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://dyslexia_user:dyslexia_secure_password_dev@db:5432/dyslexia_db
      TRUST_PROXY: "false"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: dyslexia-assistant-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
